# Restore database from backup: Docker up + restore + start dev
# NOTE: Replace backup-file path before use!
version: "18"
on_error: stop

steps:
  - name: "Start Docker services"
    command: docker.up

  - name: "Restore database"
    command: db.restore
    args:
      name: v18_exam
      backup-file: /path/to/backup.zip
      drop: true
      deactivate-cron: true
      neutralize: true
      # Optional: uninstall modules that conflict with the sanitize steps
      # before neutralize/anonymize/wipe run (string or YAML list).
      # uninstall-modules: [account_online_synchronization, l10n_de_datev]

  - name: "Start Odoo dev server"
    command: start
    args:
      mode: dev
