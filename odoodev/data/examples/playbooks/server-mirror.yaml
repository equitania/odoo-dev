# Live -> Test database mirror on a customer server (server-mode playbook).
#
# Scenario: the server runs 4 Docker containers — live-odoo/live-db and
# test-odoo/test-db. The DB containers publish no ports; odoodev reaches them
# via `docker exec`. Run as root on the server: odoodev run server-mirror.yaml
#
# Secrets (RPC credentials, customer-specific values) live in the env_file
# (chmod 600), NEVER in this YAML. Referenced as {{ env.NAME }}.
version: "18"
on_error: stop
description: "Mirror the live database to the test system with sanitize + custom SQL"

env_file: /root/.config/odoodev/mirror.env

targets:
  live:
    db_container: live-db
    odoo_container: live-odoo
    db_name: production
    # data_dir omitted -> resolved via `docker inspect` mounts at runtime
  test:
    db_container: test-db
    odoo_container: test-odoo
    db_name: production
    data_dir: /opt/odoo/test

# Connection for rpc.execute steps. Missing fields fall back to ODOO_URL,
# ODOO_PORT, ODOO_USER, ODOO_PASSWORD, ODOO_DATABASE in the env_file.
rpc:
  host: "{{ env.ODOO_URL }}"
  db: production

vars:
  customer: acme

steps:
  # The test system's current database is saved before it is replaced. A target
  # that has no database yet makes this step a no-op. The file is named
  # ..._prerestore_... and is never picked up as the mirror's source.
  - name: "Save the current state of test"
    command: server.backup
    args:
      target: test
      backup_dir: /opt/backups/docker
      safety: true

  # Optional — skip this step to mirror from the newest nightly backup instead.
  - name: "Create fresh live backup"
    command: server.backup
    args:
      target: live
      backup_dir: /opt/backups/docker
      compression_level: 5

  - name: "Stop test-odoo"
    command: container.stop
    args: { target: test, component: odoo }

  # The dump goes into a staging database and is swapped in by renaming only
  # after it restored completely — until then the existing database is
  # untouched. Needs room for the old and the new database side by side.
  - name: "Restore newest live backup into test"
    command: server.restore
    args:
      target: test
      backup_source:
        # Use the exact file the server.backup step above just created:
        mode: from_backup_step
        # Alternative — newest file matching a pattern (no backup step needed):
        # mode: newest_in_dir
        # dir: /opt/backups/docker
        # pattern: "production_live-*_dockerbackup_*.tar.zst"
        # select_by: mtime        # or: filename_timestamp
        # Alternative — explicit file:
        # mode: file
        # path: /opt/backups/docker/production_live-odoo_dockerbackup_2026-07-15_02-00-00.tar.zst
      drop: true
      template: template0
      # psql-based sanitize steps (same core functions as `odoodev db restore`):
      deactivate_cron: true       # ir_cron off, mail/fetchmail servers off
      neutralize: true            # bank-sync cleanup (odoo-bin neutralize -> own step below)
      anonymize: false            # GDPR anonymization (Faker)
      wipe: false                 # chatter and attachments deleted
      # without_pgvector: true    # restore a pgvector backup into a server without it

  - name: "Customer-specific SQL (before the server starts)"
    command: sql.execute
    args:
      target: test
      statements:
        - "UPDATE ir_config_parameter SET value = '{{ env.PARTNER_ENTERPRISE_CODE }}' WHERE key = 'database.enterprise_code';"
        - "UPDATE ir_config_parameter SET value = '' WHERE key IN ('eq_cloud_base.eq_cloud_password','eq_cloud_base.eq_cloud_url','eq_cloud_base.eq_cloud_username','eq_cloud_base.eq_is_cloud_connector_enabled');"
        - "UPDATE res_users SET eq_client_id = NULL, eq_tenant_id = NULL, eq_client_secret = NULL, eq_access_allowed = FALSE;"
        - "UPDATE website SET domain = 'https://{{ vars.customer }}-test.ownerp.app';"
    on_error: continue

  # The server's own update routine (update_docker_odoo.py from myodoo-docker),
  # run against the database that was just restored: it fetches the release,
  # builds the image, updates all modules and starts the container. The
  # database it updates is the one named for this container in
  # ~/docker2update.yaml — the preflight stops the run if that differs from the
  # target's db_name. No container.start needed: the script starts Odoo itself.
  - name: "Rebuild image, update all modules, start test-odoo"
    command: server.rebuild
    args:
      target: test                # container = odoo_container of the target
      # script_path: ~/update_docker_odoo.py
      # config: ~/docker2update.yaml
      # timeout: 7200

  # Without update_docker_odoo.py on the host, replace the step above by:
  # - name: "Start test-odoo"
  #   command: container.start
  #   args: { target: test, component: odoo }
  # - name: "Update all modules inside the running container"
  #   command: server.update-all
  #   args: { target: test, restart: true }

  # odoo-bin steps need the RUNNING container (docker exec) — always after the start.
  - name: "Neutralize (odoo-bin neutralize in the container)"
    command: server.neutralize
    args: { target: test }

  # A started container proves little. This waits for "healthy", checks that no
  # module is stuck between two states and that the login page of the database
  # loads.
  - name: "Verify that test is up on the restored database"
    command: server.verify
    args: { target: test }

  - name: "Post-restore RPC configuration"
    command: rpc.execute
    args:
      model: ir.config_parameter
      method: set_param
      args: ["mail.catchall.domain", "{{ vars.customer }}-test.ownerp.app"]
